<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Neon Rogue">
    
    <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42menkH8QAQAEcgH1Rz8uZwAAAABJRU5ErkJggg==">

    <link rel="manifest" href='data:application/manifest+json,{"name":"Neon Vector Wars","short_name":"NeonRogue","start_url":".","display":"standalone","background_color":"#050505","theme_color":"#050505","icons":[{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42menkH8QAQAEcgH1Rz8uZwAAAABJRU5ErkJggg==","sizes":"192x192","type":"image/png"}]}'>

    <title>Neon Vector Wars: Roguelite Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
            /* Removed CSS filters as they can slow down compositing on large iPad screens */
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: env(safe-area-inset-top) 20px 20px 20px; /* Notch support */
            box-sizing: border-box;
            z-index: 5;
        }
        
        /* HUD */
        .hud-left { display: flex; flex-direction: column; gap: 5px; }
        #score-hud {
            font-size: 2rem; font-weight: bold; text-shadow: 0 0 5px #0ff; color: #0ff;
        }
        #level-text {
            font-size: 1.5rem; color: #ff0; text-shadow: 0 0 5px #ff0; font-weight: bold;
        }
        #xp-container {
            width: 250px; height: 12px; background: rgba(34, 34, 34, 0.8);
            border: 2px solid #555; position: relative;
        }
        #xp-bar {
            width: 0%; height: 100%; background: #ff0;
            transition: width 0.2s ease-out;
        }

        .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        .icon-row { display: flex; flex-direction: row-reverse; gap: 5px; height: 25px; }
        .hud-icon { width: 25px; height: 25px; } /* Removed drop-shadow filter for performance */

        /* Boss UI */
        #boss-hp-container {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            width: 400px; max-width: 80%; height: 20px; border: 2px solid #f00; display: none;
        }
        #boss-hp-bar {
            width: 100%; height: 100%; background-color: #f00;
            transition: width 0.1s;
        }
        #boss-label {
            text-align: center; color: #f00; margin-top: -25px;
            font-weight: bold; text-shadow: 0 0 2px #f00;
        }

        /* Level Up Screen */
        #level-up-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; pointer-events: auto;
            backdrop-filter: blur(5px); /* Nice effect, slight cost but ok for static menu */
        }
        #level-up-title {
            font-size: 3rem; color: #ff0; text-shadow: 0 0 10px #ff0; margin-bottom: 40px;
            letter-spacing: 5px; text-transform: uppercase; text-align: center;
        }
        .card-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .upgrade-card {
            width: 220px; height: 300px;
            border: 2px solid #0ff; background: rgba(0, 20, 20, 0.9);
            padding: 20px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            cursor: pointer; transition: transform 0.1s;
            box-shadow: 0 0 10px #0ff;
        }
        .upgrade-card:active { transform: scale(0.95); }
        .upgrade-card.selected {
            transform: scale(1.05); background: #111;
            border-color: #ff0; box-shadow: 0 0 15px #ff0;
        }
        .card-title { font-size: 1.2rem; color: #fff; margin-bottom: 10px; font-weight: bold; }
        .card-type { font-size: 0.8rem; color: #888; margin-bottom: 20px; text-transform: uppercase; }
        .card-desc { font-size: 0.9rem; color: #ccc; line-height: 1.4; }
        .card-stat { margin-top: auto; color: #0f0; font-size: 1.1rem; }
        
        /* Dash Status */
        #dash-status {
            font-size: 1rem; color: #0ff; text-shadow: 0 0 5px #0ff; margin-top: 5px;
        }

        /* Start Screen */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: auto; transition: opacity 0.5s;
        }
        h1 {
            font-size: 4rem; margin: 0 0 20px 0; color: #fff;
            text-shadow: 0 0 10px #0ff, 0 0 20px #00f; text-align: center; letter-spacing: 5px;
        }
        button {
            background: transparent; border: 2px solid #0f0; color: #0f0;
            padding: 15px 40px; font-size: 1.5rem; font-family: inherit; cursor: pointer;
            text-shadow: 0 0 5px #0f0; box-shadow: 0 0 5px #0f0;
            transition: all 0.2s; text-transform: uppercase;
        }
        button:hover, button:active {
            background: #0f0; color: #000;
        }
        .controls { margin-top: 30px; color: #aaa; text-align: center; line-height: 1.6; font-size: 0.9rem; }
        .key {
            border: 1px solid #666; padding: 2px 6px; border-radius: 4px;
            background: #222; color: #fff; margin: 0 2px; font-size: 0.9em;
        }

        /* --- TOUCH CONTROLS --- */
        #touch-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 25; pointer-events: none; display: none; 
        }
        .joystick-zone {
            position: absolute; bottom: 50px; width: 140px; height: 140px;
            pointer-events: auto; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            will-change: transform; /* GPU hint */
        }
        #stick-left { left: 40px; }
        #stick-right { right: 40px; }
        
        .joystick-nub {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            margin-top: -25px; margin-left: -25px;
            background: rgba(0, 255, 255, 0.3); border-radius: 50%;
            box-shadow: 0 0 5px #0ff;
            transform: translate(0px, 0px); 
            will-change: transform;
        }
        #nub-right { background: rgba(255, 0, 0, 0.3); box-shadow: 0 0 5px #f00; }

        .touch-btn {
            position: absolute; width: 65px; height: 65px; border-radius: 50%;
            background: rgba(34, 34, 34, 0.6); border: 2px solid #fff;
            pointer-events: auto; display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #fff; font-size: 0.8rem;
            will-change: transform;
        }
        .touch-btn:active { background: #fff; color: #000; }
        /* Positioned slightly inwards for ergonomics on iPad */
        #btn-dash { bottom: 200px; right: 40px; border-color: #0ff; color: #0ff; }
        #btn-bomb { bottom: 200px; left: 40px; border-color: #ff0; color: #ff0; }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="touch-layer">
        <div id="stick-left" class="joystick-zone"><div id="nub-left" class="joystick-nub"></div></div>
        <div id="stick-right" class="joystick-zone"><div id="nub-right" class="joystick-nub"></div></div>
        <div id="btn-bomb" class="touch-btn">BOMB</div>
        <div id="btn-dash" class="touch-btn">DASH</div>
    </div>

    <div id="ui-layer">
        <div class="hud-left">
            <div id="score-hud">0</div>
            <div id="level-text">LVL 1</div>
            <div id="xp-container">
                <div id="xp-bar"></div>
            </div>
        </div>

        <div class="hud-right">
            <div id="lives-container" class="icon-row"></div>
            <div id="bombs-container" class="icon-row"></div>
            <div id="dash-status">DASH READY</div>
        </div>
        
        <div id="boss-hp-container">
            <div id="boss-label">WARNING: BOSS DETECTED</div>
            <div id="boss-hp-bar"></div>
        </div>
    </div>

    <div id="level-up-screen">
        <div id="level-up-title">SYSTEM UPGRADE</div>
        <div class="card-container" id="card-container"></div>
        <div style="color: #888; margin-top: 20px; font-size: 0.8rem;">Select Upgrade</div>
    </div>

    <div id="start-screen">
        <h1>NEON ROGUE</h1>
        <button id="start-btn">INITIATE RUN</button>
        <div class="controls">
            <p>PC: <span class="key">WASD</span> + <span class="key">MOUSE</span></p>
            <p style="color: #ff0; font-size: 0.9em; margin-top: 10px;">TABLET/MOBILE: ON-SCREEN CONTROLS DETECTED</p>
        </div>
    </div>

    <script>
        // PREVENT DEFAULT TOUCH BEHAVIORS (SCROLL/ZOOM)
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

        class Vec3 { constructor(x, y, z) { this.x = x; this.y = y; this.z = z; } }
        
        // --- INPUT MANAGER ---
        const Input = {
            move: { x: 0, y: 0 }, aim: { x: 0, y: 0 }, isFiring: false, dash: false, bomb: false, confirm: false, menuMove: 0,
            usingMouse: true, mouseX: 0, mouseY: 0, keys: {}, lastMenuMove: 0, lastConfirm: false,
            
            init: function() {
                window.addEventListener('keydown', e => { 
                    this.keys[e.key.toLowerCase()] = true; 
                    if (e.key === ' ') this.bomb = true;
                    if (e.key === 'Shift') this.dash = true;
                });
                window.addEventListener('keyup', e => { 
                    this.keys[e.key.toLowerCase()] = false; 
                    if (e.key === ' ') this.bomb = false;
                    if (e.key === 'Shift') this.dash = false;
                });
                window.addEventListener('mousemove', e => { 
                    this.mouseX = e.clientX; this.mouseY = e.clientY; 
                    this.usingMouse = true;
                });
                window.addEventListener('mousedown', () => { this.isFiring = true; this.confirm = true; });
                window.addEventListener('mouseup', () => { this.isFiring = false; this.confirm = false; });

                this.setupTouch();
            },

            update: function() {
                let kx = 0, ky = 0;
                if (this.keys['a'] || this.keys['arrowleft']) kx -= 1;
                if (this.keys['d'] || this.keys['arrowright']) kx += 1;
                if (this.keys['w'] || this.keys['arrowup']) ky -= 1;
                if (this.keys['s'] || this.keys['arrowdown']) ky += 1;

                this.menuMove = 0;
                if (this.keys['a'] || this.keys['arrowleft']) this.menuMove = -1;
                if (this.keys['d'] || this.keys['arrowright']) this.menuMove = 1;
                if (this.keys['enter']) this.confirm = true;

                // Gamepad
                const gamepad = navigator.getGamepads ? navigator.getGamepads()[0] : null;
                let gx = 0, gy = 0, ax = 0, ay = 0;
                
                if (gamepad) {
                    this.usingMouse = false;
                    const dead = 0.15;
                    if (Math.abs(gamepad.axes[0]) > dead) gx = gamepad.axes[0];
                    if (Math.abs(gamepad.axes[1]) > dead) gy = gamepad.axes[1];
                    if (Math.abs(gamepad.axes[2]) > dead) ax = gamepad.axes[2];
                    if (Math.abs(gamepad.axes[3]) > dead) ay = gamepad.axes[3];

                    if (Math.hypot(ax, ay) > 0.3) this.isFiring = true; else this.isFiring = false;

                    if (gamepad.buttons[4].pressed || gamepad.buttons[6].pressed) this.dash = true; else this.dash = false; 
                    if (gamepad.buttons[5].pressed || gamepad.buttons[7].pressed) this.bomb = true; else this.bomb = false;
                    if (gamepad.buttons[0].pressed) this.confirm = true; else this.confirm = false;

                    if (gx < -0.5) this.menuMove = -1; else if (gx > 0.5) this.menuMove = 1;
                }

                // Touch
                if (this.touchActive) {
                    this.usingMouse = false;
                    if (this.touchLeft.active) { kx = this.touchLeft.x; ky = this.touchLeft.y; }
                    if (this.touchRight.active) { ax = this.touchRight.x; ay = this.touchRight.y; this.isFiring = true; } 
                    else if (!gamepad) { this.isFiring = false; }
                }

                if (gamepad) { this.move.x = gx; this.move.y = gy; } else { this.move.x = kx; this.move.y = ky; }
                if (!this.usingMouse) { this.aim.x = ax; this.aim.y = ay; }
            },

            touchActive: false,
            touchLeft: { x:0, y:0, active:false, id:null, startX:0, startY:0 },
            touchRight: { x:0, y:0, active:false, id:null, startX:0, startY:0 },
            
            setupTouch: function() {
                if ('ontouchstart' in window || navigator.maxTouchPoints) {
                    document.getElementById('touch-layer').style.display = 'block';
                    this.touchActive = true;
                    const setupZone = (zoneId, data, nubId) => {
                        const zone = document.getElementById(zoneId);
                        zone.addEventListener('touchstart', e => {
                            e.preventDefault();
                            const touch = e.changedTouches[0];
                            data.id = touch.identifier; data.active = true;
                            const rect = zone.getBoundingClientRect();
                            data.startX = rect.left + rect.width/2; data.startY = rect.top + rect.height/2;
                            this.updateStick(data, touch.clientX, touch.clientY, nubId);
                        }, {passive:false});
                        zone.addEventListener('touchmove', e => {
                            e.preventDefault();
                            for(let i=0; i<e.changedTouches.length; i++) {
                                if(e.changedTouches[i].identifier === data.id) {
                                    this.updateStick(data, e.changedTouches[i].clientX, e.changedTouches[i].clientY, nubId);
                                }
                            }
                        }, {passive:false});
                        const end = (e) => {
                            for(let i=0; i<e.changedTouches.length; i++) {
                                if(e.changedTouches[i].identifier === data.id) {
                                    data.active = false; data.x = 0; data.y = 0;
                                    document.getElementById(nubId).style.transform = `translate(0px, 0px)`;
                                }
                            }
                        };
                        zone.addEventListener('touchend', end); zone.addEventListener('touchcancel', end);
                    };
                    setupZone('stick-left', this.touchLeft, 'nub-left');
                    setupZone('stick-right', this.touchRight, 'nub-right');

                    const btnDash = document.getElementById('btn-dash');
                    const btnBomb = document.getElementById('btn-bomb');
                    btnDash.addEventListener('touchstart', (e) => { e.preventDefault(); this.dash = true; });
                    btnDash.addEventListener('touchend', (e) => { e.preventDefault(); this.dash = false; });
                    btnBomb.addEventListener('touchstart', (e) => { e.preventDefault(); this.bomb = true; });
                    btnBomb.addEventListener('touchend', (e) => { e.preventDefault(); this.bomb = false; });
                }
            },

            updateStick: function(stickData, cx, cy, elId) {
                const maxDist = 40;
                let dx = cx - stickData.startX;
                let dy = cy - stickData.startY;
                const dist = Math.hypot(dx, dy);
                if (dist > maxDist) { dx = (dx/dist) * maxDist; dy = (dy/dist) * maxDist; }
                stickData.x = dx / maxDist; stickData.y = dy / maxDist;
                document.getElementById(elId).style.transform = `translate(${dx}px, ${dy}px)`;
            }
        };

        // --- AUDIO ENGINE ---
        const AudioEngine = {
            ctx: null, musicTimer: null, beatCount: 0, currentTheme: null,
            init: function() {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            },
            playTone: function(freq, type, duration, vol = 0.1, slideTo = null) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + duration);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration); 
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            },
            playNoise: function(duration, vol) {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                noise.connect(gain); gain.connect(this.ctx.destination);
                noise.start();
            },
            playSound: function(name) {
                if (!this.ctx) return;
                // Optimization: Simplified sound triggers
                if(name==='shoot') this.playTone(800 + (Math.random()*200), 'sawtooth', 0.1, 0.05, 400);
                else if(name==='enemy_death') { this.playTone(150, 'square', 0.1, 0.1, 50); this.playNoise(0.1, 0.1); }
                else if(name==='shard') this.playTone(1200, 'sine', 0.05, 0.03);
                else if(name==='bomb') { this.playTone(100, 'square', 0.5, 0.3, 10); this.playNoise(0.6, 0.4); }
                else if(name==='player_hit') { this.playTone(100, 'sawtooth', 0.5, 0.2, 10); }
                else if(name==='powerup') { this.playTone(600, 'sine', 0.1, 0.1, 1200); }
                else if(name==='select') this.playTone(880, 'sine', 0.05, 0.1);
            },
            startMusic: function(theme) {
                if (!this.ctx || (this.currentTheme === theme && this.musicTimer)) return;
                if (this.musicTimer) clearInterval(this.musicTimer);
                this.currentTheme = theme; this.beatCount = 0;
                const bpm = 140; const interval = (60 / bpm) * 1000 / 4;
                // Very simple procedural beat
                this.musicTimer = setInterval(() => {
                    const step = this.beatCount;
                    if (step % 16 === 0) this.playTone(100, 'square', 0.1, 0.1, 50); // Bass
                    if (step % 16 === 8) this.playNoise(0.1, 0.1); // Snare
                    if (step % 4 === 0) this.playNoise(0.02, 0.05); // Hi-hat
                    
                    // Simple arpeggios based on theme
                    if (theme === 'stage' && step % 2 === 0) {
                        const notes = [220, 261, 329, 392];
                        this.playTone(notes[Math.floor(Math.random()*notes.length)], 'sawtooth', 0.1, 0.05);
                    } else if (theme.startsWith('boss') && step % 4 === 0) {
                        this.playTone(150, 'sawtooth', 0.1, 0.1, 100);
                    }
                    this.beatCount++;
                }, interval);
            },
            stopMusic: function() { if (this.musicTimer) clearInterval(this.musicTimer); }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimization: Alpha false
        let width, height;

        const state = {
            running: false, paused: false, score: 0, frames: 0, difficulty: 1,
            nextBossScore: 20000, bossActive: false, bossCount: 0, lastBossType: -1, screenFlash: 0,
            xp: 0, xpNeeded: 10, level: 1, activeOptions: [], selectedOptionIndex: 0
        };

        let player, bullets = [], enemies = [], powerups = [], shards = [], particles = [], grid = [];

        const UPGRADES = [
            { id: 'multishot', name: 'SPLIT FIRE', type: 'Weapon', desc: 'Add +1 projectile.', stat: 'bulletCount', val: 1 },
            { id: 'fireRate', name: 'ACCELERATOR', type: 'Weapon', desc: 'Fire rate +15%.', stat: 'fireRate', val: 0.85 },
            { id: 'damage', name: 'HIGH VOLTAGE', type: 'Power', desc: 'Damage +0.5.', stat: 'damage', val: 0.5 },
            { id: 'speed', name: 'THRUSTERS', type: 'Mobility', desc: 'Speed +10%.', stat: 'speed', val: 1.1 },
            { id: 'magnet', name: 'ATTRACTOR', type: 'Utility', desc: 'Magnet Radius +50.', stat: 'magnetRadius', val: 50 },
            { id: 'bomb', name: 'RESUPPLY', type: 'Utility', desc: '+1 Bomb.', stat: 'bombStock', val: 1 },
            { id: 'maxhp', name: 'HULL PLATING', type: 'Defense', desc: 'Max HP +1.', stat: 'maxHp', val: 1 },
            { id: 'repair', name: 'NANOBOTS', type: 'Defense', desc: 'Full Repair.', stat: 'heal', val: 999 }
        ];

        const SHAPES = {
            ship: [new Vec3(0, -15, 0), new Vec3(10, 10, 0), new Vec3(0, 5, 0), new Vec3(-10, 10, 0)],
            cube: [new Vec3(-10,-10,10), new Vec3(10,-10,10), new Vec3(10,10,10), new Vec3(-10,10,10), new Vec3(-10,-10,10)],
            diamond: [new Vec3(0, -15, 0), new Vec3(10, 0, 0), new Vec3(0, 15, 0), new Vec3(-10, 0, 0), new Vec3(0, -15, 0)],
            shuriken: [new Vec3(0, -20, 0), new Vec3(5, -5, 0), new Vec3(20, 0, 0), new Vec3(5, 5, 0), new Vec3(0, 20, 0), new Vec3(-5, 5, 0), new Vec3(-20, 0, 0), new Vec3(-5, -5, 0), new Vec3(0, -20, 0)],
            shard: [new Vec3(0,-8,0), new Vec3(5,0,0), new Vec3(0,8,0), new Vec3(-5,0,0), new Vec3(0,-8,0)],
            // Simplified Boss Shapes for Performance
            boss: [new Vec3(-30, -30, 0), new Vec3(30, -30, 0), new Vec3(30, 30, 0), new Vec3(-30, 30, 0), new Vec3(-30, -30, 0)]
        };

        class Entity {
            constructor(x, y, shape, color) {
                this.pos = { x, y };
                this.vel = { x: 0, y: 0 };
                this.angle = 0;
                this.rotation = { x: 0, y: 0, z: 0 };
                this.rotVel = { x: Math.random()*0.05, y: Math.random()*0.05, z: Math.random()*0.05 };
                this.shape = shape; this.color = color;
                this.scale = 1; this.dead = false; this.radius = 15;
                this.enteredArena = false; this.id = Math.random();
            }
            update() {
                this.pos.x += this.vel.x; this.pos.y += this.vel.y;
                this.rotation.x += this.rotVel.x; this.rotation.y += this.rotVel.y; this.rotation.z += this.rotVel.z;
                
                // Boundary Check
                const hw = width/2 - this.radius; const hh = height/2 - this.radius;
                if (!this.enteredArena) {
                    if (this.pos.x > -hw && this.pos.x < hw && this.pos.y > -hh && this.pos.y < hh) this.enteredArena = true;
                }
                if (this.enteredArena || this instanceof Player) {
                    if (this.pos.x < -hw) { this.pos.x = -hw; this.vel.x *= -1; } 
                    else if (this.pos.x > hw) { this.pos.x = hw; this.vel.x *= -1; }
                    if (this.pos.y < -hh) { this.pos.y = -hh; this.vel.y *= -1; } 
                    else if (this.pos.y > hh) { this.pos.y = hh; this.vel.y *= -1; }
                }
            }
            draw() {
                if (this.dead) return;
                ctx.beginPath(); ctx.strokeStyle = this.color; ctx.lineWidth = 2;
                // OPTIMIZATION: REMOVED SHADOWBLUR
                // Shadows are faked via globalCompositeOperation = 'lighter' in loop
                
                // OPTIMIZATION: INLINED 3D MATH TO PREVENT GC ALLOCATION
                const cosX = Math.cos(this.rotation.x), sinX = Math.sin(this.rotation.x);
                const cosY = Math.cos(this.rotation.y), sinY = Math.sin(this.rotation.y);
                const cosZ = Math.cos(this.rotation.z + this.angle), sinZ = Math.sin(this.rotation.z + this.angle);
                const cx = this.pos.x + width/2, cy = this.pos.y + height/2;

                let first = true;
                for (let i = 0; i < this.shape.length; i++) {
                    const v = this.shape[i];
                    // Rotate X
                    let y1 = v.y * cosX - v.z * sinX;
                    let z1 = v.y * sinX + v.z * cosX;
                    // Rotate Y
                    let x2 = v.x * cosY + z1 * sinY;
                    // Rotate Z (final 2D projection x/y)
                    let x3 = x2 * cosZ - y1 * sinZ;
                    let y3 = x2 * sinZ + y1 * cosZ;

                    const px = (x3 * this.scale) + cx;
                    const py = (y3 * this.scale) + cy;

                    if (first) { ctx.moveTo(px, py); first = false; } else { ctx.lineTo(px, py); }
                }
                ctx.stroke();
            }
        }

        class Particle extends Entity {
            constructor(x, y, color) {
                super(x, y, [], color);
                this.vel.x = (Math.random() - 0.5) * 8;
                this.vel.y = (Math.random() - 0.5) * 8;
                this.life = 20 + Math.random() * 15; this.maxLife = this.life;
            }
            draw() {
                if (this.dead) return;
                // Simple rects are much faster than paths for particles
                ctx.fillStyle = this.color; 
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillRect(this.pos.x+width/2, this.pos.y+height/2, 3, 3);
                ctx.globalAlpha = 1.0;
                this.pos.x += this.vel.x; this.pos.y += this.vel.y;
                this.life--; if (this.life <= 0) this.dead = true;
            }
        }

        class Player extends Entity {
            constructor() {
                super(0, 0, SHAPES.ship, '#0ff');
                this.friction = 0.92; this.accel = 0.8;
                this.fireTimer = 0; this.bombs = 1; this.maxBombs = 3;
                this.invulnerable = 0; this.dashCooldown = 0; this.dashTimer = 0;
                this.stats = { bulletCount: 1, fireRate: 8, speed: 0.8, damage: 1, maxHp: 3, magnetRadius: 200, piercing: 0 };
                this.hp = this.stats.maxHp;
                this.enteredArena = true;
            }
            update() {
                Input.update();
                const accel = this.accel * this.stats.speed;
                if (Input.move.y < 0) this.vel.y += Input.move.y * accel;
                if (Input.move.y > 0) this.vel.y += Input.move.y * accel;
                if (Input.move.x < 0) this.vel.x += Input.move.x * accel;
                if (Input.move.x > 0) this.vel.x += Input.move.x * accel;
                
                if (Input.dash && this.dashCooldown <= 0) this.dash();
                
                if (this.dashTimer > 0) {
                    this.dashTimer--;
                    if (this.dashTimer % 3 === 0) particles.push(new Particle(this.pos.x, this.pos.y, '#0ff'));
                } else {
                    this.vel.x *= this.friction; this.vel.y *= this.friction;
                }
                
                if (this.dashCooldown > 0) {
                    this.dashCooldown--;
                    const hud = document.getElementById('dash-status');
                    if(hud) { hud.style.color='#555'; hud.innerText="RECHARGING"; }
                } else {
                    const hud = document.getElementById('dash-status');
                    if(hud) { hud.style.color='#0ff'; hud.innerText="DASH READY"; }
                }

                const maxSpeed = (this.dashTimer > 0) ? 25 : (10 * this.stats.speed); 
                const speed = Math.hypot(this.vel.x, this.vel.y);
                if (speed > maxSpeed) { this.vel.x = (this.vel.x/speed)*maxSpeed; this.vel.y = (this.vel.y/speed)*maxSpeed; }

                super.update();
                
                if (Input.usingMouse) {
                    this.angle = Math.atan2(Input.mouseY - (this.pos.y + height/2), Input.mouseX - (this.pos.x + width/2)) + Math.PI/2;
                } else if (Math.hypot(Input.aim.x, Input.aim.y) > 0.1) {
                    this.angle = Math.atan2(Input.aim.y, Input.aim.x) + Math.PI/2;
                }

                if (Input.bomb && this.bombs > 0) { this.bombs--; updateHud(); this.useBomb(); Input.bomb = false; }
                if (this.fireTimer > 0) this.fireTimer--;
                if (Input.isFiring && this.fireTimer <= 0) this.shoot();

                if (this.invulnerable > 0) { this.invulnerable--; this.color = (Math.floor(Date.now()/50)%2===0)?'#0ff':'#000'; } else this.color = '#0ff';
            }
            dash() {
                this.dashCooldown = 120; this.dashTimer = 10; this.invulnerable = 15; AudioEngine.playSound('select');
                let dx = 0, dy = 0;
                if (Math.abs(Input.move.x) > 0.1 || Math.abs(Input.move.y) > 0.1) { dx = Input.move.x; dy = Input.move.y; } 
                else { const angle = this.angle - Math.PI/2; dx = Math.cos(angle); dy = Math.sin(angle); }
                const len = Math.hypot(dx, dy);
                if (len > 0) { this.vel.x = (dx/len) * 25; this.vel.y = (dy/len) * 25; }
                createExplosion(this.pos.x, this.pos.y, '#0ff', 5);
            }
            useBomb() {
                state.screenFlash = 0.8; AudioEngine.playSound('bomb');
                bullets = [];
                enemies.forEach(e => { if (e instanceof Boss) e.takeDamage(100); else e.hit(100); });
            }
            shoot() {
                this.fireTimer = this.stats.fireRate;
                const aimAngle = this.angle - Math.PI/2;
                AudioEngine.playSound('shoot');
                const count = this.stats.bulletCount;
                const spread = 0.2;
                const startAngle = aimAngle - ((count - 1) * spread) / 2;
                for(let i=0; i<count; i++) {
                    bullets.push(new Bullet(this.pos.x, this.pos.y, startAngle + (i * spread), false, this.stats.damage, this.stats.piercing));
                }
                this.vel.x -= Math.cos(aimAngle) * 1; this.vel.y -= Math.sin(aimAngle) * 1;
            }
            applyUpgrade(u) {
                if (u.stat === 'bulletCount') this.stats.bulletCount += u.val;
                if (u.stat === 'fireRate') this.stats.fireRate *= u.val;
                if (u.stat === 'damage') this.stats.damage += u.val;
                if (u.stat === 'speed') this.stats.speed *= u.val;
                if (u.stat === 'magnetRadius') this.stats.magnetRadius += u.val;
                if (u.stat === 'bombStock') { this.bombs += u.val; this.maxBombs += u.val; }
                if (u.stat === 'maxHp') { this.stats.maxHp += u.val; this.hp += u.val; }
                if (u.stat === 'heal') this.hp = this.stats.maxHp;
                updateHud();
            }
        }

        class Bullet extends Entity {
            constructor(x, y, angle, isEnemy = false, damage = 1, piercing = 0, speed = 15) {
                const shape = [new Vec3(0,-5,0), new Vec3(0,5,0)];
                super(x, y, shape, isEnemy ? '#f00' : '#ff0'); 
                this.angle = angle + Math.PI/2; this.isEnemy = isEnemy;
                this.damage = damage; this.piercing = piercing; this.hitIds = []; 
                if(isEnemy) speed = 6;
                this.vel.x = Math.cos(angle) * speed; this.vel.y = Math.sin(angle) * speed;
                this.life = isEnemy ? 180 : 60; 
            }
            update() {
                this.pos.x += this.vel.x; this.pos.y += this.vel.y;
                this.life--; if (this.life <= 0) this.dead = true;
            }
        }

        class Enemy extends Entity {
            constructor(type) {
                let shape, color, hp, scoreVal, speed;
                if (type === 'grunt') { shape = SHAPES.cube; color = '#f0f'; hp = 1; scoreVal = 100; speed = 2; } 
                else if (type === 'chaser') { shape = SHAPES.diamond; color = '#f00'; hp = 2; scoreVal = 250; speed = 3.5; } 
                else { shape = SHAPES.shuriken; color = '#f80'; hp = 5; scoreVal = 500; speed = 1.5; }
                
                hp += Math.floor(state.difficulty * 0.5);
                
                // Spawn outside
                let ex, ey, safe=false;
                while(!safe) {
                    ex = (Math.random()-0.5)*width*1.5; ey = (Math.random()-0.5)*height*1.5;
                    if(Math.abs(ex)>width/2+50 || Math.abs(ey)>height/2+50) safe=true;
                }

                super(ex, ey, shape, color);
                this.type = type; this.hp = hp; this.maxHp = hp; this.scoreVal = scoreVal; this.baseSpeed = speed;
            }
            update() {
                super.update();
                if (!player.dead) {
                    const dx = player.pos.x - this.pos.x; const dy = player.pos.y - this.pos.y;
                    const angle = Math.atan2(dy, dx);
                    const speed = this.baseSpeed + (state.difficulty * 0.1);
                    
                    if (this.type === 'grunt') {
                         this.vel.x += Math.cos(angle) * 0.1; this.vel.y += Math.sin(angle) * 0.1;
                         const s = Math.hypot(this.vel.x, this.vel.y);
                         if(s>speed) { this.vel.x = (this.vel.x/s)*speed; this.vel.y = (this.vel.y/s)*speed; }
                    } else {
                         this.vel.x = Math.cos(angle) * speed; this.vel.y = Math.sin(angle) * speed;
                    }
                    if(this.type !== 'grunt') this.rotVel.z = 0.2;
                }
            }
            hit(damage) {
                this.hp -= damage;
                const oldColor = this.color; this.color = '#fff'; setTimeout(() => { if(!this.dead) this.color = oldColor; }, 50);
                if (this.hp <= 0) {
                    this.dead = true; createExplosion(this.pos.x, this.pos.y, this.color, 10); // Reduced particles
                    AudioEngine.playSound('enemy_death'); addScore(this.scoreVal);
                    shards.push(new Shard(this.pos.x, this.pos.y));
                    if(Math.random() < 0.03) powerups.push(new PowerUp(this.pos.x, this.pos.y));
                }
            }
        }

        class Boss extends Entity {
            constructor() {
                super(0, -height/2 - 100, SHAPES.boss, '#f00');
                AudioEngine.startMusic('boss0');
                this.scale = 4; this.radius = 100; this.hp = 50 + (state.difficulty * 15); this.maxHp = this.hp;
                this.attackTimer = 0; this.attackState = 0; this.vel.y = 3; this.enteredArena = true;
                document.getElementById('boss-hp-container').style.display = 'block';
                updateBossUI(100);
            }
            update() {
                this.pos.x += this.vel.x; this.pos.y += this.vel.y;
                if (this.pos.y > -height/4 && this.attackState === 0) { this.vel.y = 0; this.attackState = 1; }
                this.attackTimer++; this.rotation.y += 0.01;
                if (this.attackState > 0) {
                    // Simple pattern
                    this.vel.x = Math.sin(this.attackTimer * 0.02) * 3;
                    if(this.attackTimer % 60 === 0) {
                        const angle = Math.atan2(player.pos.y - this.pos.y, player.pos.x - this.pos.x);
                        bullets.push(new Bullet(this.pos.x, this.pos.y, angle, true, 1, 0, 8));
                        bullets.push(new Bullet(this.pos.x, this.pos.y, angle-0.2, true, 1, 0, 8));
                        bullets.push(new Bullet(this.pos.x, this.pos.y, angle+0.2, true, 1, 0, 8));
                        AudioEngine.playSound('enemy_death');
                    }
                    if(this.attackTimer % 10 === 0) {
                         bullets.push(new Bullet(this.pos.x, this.pos.y, this.attackTimer*0.1, true, 1, 0, 5));
                    }
                }
            }
            takeDamage(amount) {
                this.hp -= amount; updateBossUI((this.hp/this.maxHp)*100);
                if(this.hp <= 0) {
                    this.dead = true; state.bossActive = false; 
                    createExplosion(this.pos.x, this.pos.y, '#f00', 50); AudioEngine.playSound('enemy_death');
                    addScore(10000); state.nextBossScore = state.score + 30000; 
                    document.getElementById('boss-hp-container').style.display = 'none';
                    AudioEngine.startMusic('stage');
                    powerups.push(new PowerUp(this.pos.x, this.pos.y, 'BOMB'));
                    state.difficulty += 2;
                }
            }
        }

        class Shard extends Entity {
            constructor(x, y) { super(x, y, SHAPES.shard, '#ff0'); this.life = 600; }
            update() {
                super.update();
                const dx = player.pos.x - this.pos.x; const dy = player.pos.y - this.pos.y;
                const dist = Math.hypot(dx, dy);
                if (dist < player.stats.magnetRadius) { this.vel.x += (dx / dist) * 0.5; this.vel.y += (dy / dist) * 0.5; }
                this.life--; if(this.life <= 0) this.dead = true;
            }
        }

        class PowerUp extends Entity {
            constructor(x, y, forceType = null) {
                super(x, y, SHAPES.cube, '#0f0');
                this.type = forceType || (Math.random() < 0.4 ? 'BOMB' : 'LIFE');
                this.color = this.type === 'BOMB' ? '#ff0' : '#0f0';
                this.life = 800;
            }
            update() { super.update(); this.life--; if(this.life<0) this.dead=true; }
            draw() {
                if(this.dead) return;
                super.draw();
                ctx.fillStyle = this.color; ctx.font = "bold 20px Courier New"; 
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(this.type === 'BOMB' ? 'B' : 'L', this.pos.x+width/2, this.pos.y+height/2);
            }
        }

        // --- GRID ---
        class GridLine {
            constructor(p1, p2) { this.p1 = p1; this.p2 = p2; }
            draw() {
                const ox = -player.pos.x * 0.2; const oy = -player.pos.y * 0.2;
                // Simplified Grid Draw
                let x1 = (this.p1.x + ox) % (width*1.5); let y1 = (this.p1.y + oy) % (height*1.5);
                let x2 = (this.p2.x + ox) % (width*1.5); let y2 = (this.p2.y + oy) % (height*1.5);
                // Wrap
                if(x1 < -width/2) x1+=width*1.5; if(x1 > width) x1-=width*1.5;
                if(y1 < -height/2) y1+=height*1.5; if(y1 > height) y1-=height*1.5;
                if(x2 < -width/2) x2+=width*1.5; if(x2 > width) x2-=width*1.5;
                if(y2 < -height/2) y2+=height*1.5; if(y2 > height) y2-=height*1.5;
                
                if(Math.abs(x1-x2)<100 && Math.abs(y1-y2)<100) {
                     ctx.beginPath(); ctx.moveTo(x1+width/2, y1+height/2); ctx.lineTo(x2+width/2, y2+height/2); ctx.stroke();
                }
            }
        }

        function init() {
            resize(); window.addEventListener('resize', resize);
            Input.init();
            document.getElementById('start-btn').addEventListener('click', startGame);
            createGrid();
            loop(); // Start loop immediately but pause game state
        }

        function createGrid() {
            grid = []; const step = 100; // Wider grid for performance
            const cx = Math.ceil((window.innerWidth * 1.5)/step); const cy = Math.ceil((window.innerHeight * 1.5)/step);
            for (let i = -cx; i < cx; i++) grid.push(new GridLine({x: i*step, y: -height}, {x: i*step, y: height}));
            for (let i = -cy; i < cy; i++) grid.push(new GridLine({x: -width, y: i*step}, {x: width, y: i*step}));
        }

        function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; createGrid(); }
        function createExplosion(x, y, color, count) { for(let i=0; i<count; i++) particles.push(new Particle(x, y, color)); }
        function addScore(val) { state.score += val; updateHud(); }
        function updateHud() {
            document.getElementById('score-hud').innerText = state.score;
            document.getElementById('level-text').innerText = "LVL " + state.level;
            document.getElementById('xp-bar').style.width = (state.xp / state.xpNeeded * 100) + '%';
            const livesContainer = document.getElementById('lives-container');
            livesContainer.innerHTML = '';
            for(let i=0; i<player.stats.maxHp; i++) livesContainer.innerHTML += `<div style="width:15px;height:15px;border:1px solid #0ff;background:${i<player.hp?'#0ff':'transparent'}"></div>`;
            const bombsContainer = document.getElementById('bombs-container');
            bombsContainer.innerHTML = '';
            for(let i=0; i<player.bombs; i++) bombsContainer.innerHTML += `<div style="width:15px;height:15px;border:1px solid #ff0;border-radius:50%;background:#ff0"></div>`;
        }
        function updateBossUI(percent) { document.getElementById('boss-hp-bar').style.width = percent + '%'; }

        function startGame() {
            AudioEngine.init(); AudioEngine.startMusic('stage');
            document.getElementById('start-screen').style.display = 'none';
            player = new Player();
            bullets = []; enemies = []; powerups = []; particles = []; shards = [];
            state.score = 0; state.running = true; state.difficulty = 1;
            updateHud(); 
        }

        function showLevelUpScreen() {
            state.paused = true;
            document.getElementById('level-up-screen').style.display = 'flex';
            const container = document.getElementById('card-container');
            container.innerHTML = '';
            const options = [];
            while(options.length < 3) {
                const rand = UPGRADES[Math.floor(Math.random() * UPGRADES.length)];
                if (!options.includes(rand)) options.push(rand);
            }
            options.forEach((opt) => {
                const card = document.createElement('div'); card.className = 'upgrade-card';
                card.innerHTML = `<div class="card-title">${opt.name}</div><div class="card-desc">${opt.desc}</div>`;
                card.onclick = () => {
                    player.applyUpgrade(opt);
                    document.getElementById('level-up-screen').style.display = 'none';
                    state.paused = false; state.level++; state.xp = 0; state.xpNeeded = Math.floor(state.xpNeeded * 1.4);
                    updateHud();
                };
                container.appendChild(card);
            });
        }

        function loop() {
            requestAnimationFrame(loop);
            
            // Draw Background
            ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, width, height);
            
            // KEY OPTIMIZATION: Lighter Composite Mode replaces ShadowBlur
            ctx.globalCompositeOperation = 'lighter'; 
            ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
            
            // Camera Shake (Simplified)
            let sx=0, sy=0; if(state.screenFlash > 0) { state.screenFlash-=0.1; ctx.fillStyle=`rgba(255,255,255,${state.screenFlash*0.2})`; ctx.fillRect(0,0,width,height); sx=(Math.random()-0.5)*10; sy=(Math.random()-0.5)*10; }
            ctx.save(); ctx.translate(sx, sy);
            
            grid.forEach(g => g.draw());
            particles.forEach(p => p.draw());
            if(state.running && player) player.draw();
            bullets.forEach(b => b.draw());
            enemies.forEach(e => e.draw());
            shards.forEach(s => s.draw());
            powerups.forEach(p => p.draw());
            ctx.restore();
            
            // Reset Composite for text/ui if drawn on canvas
            ctx.globalCompositeOperation = 'source-over';

            if (!state.running || state.paused) return;

            player.update();
            
            // Spawn Logic
            if(state.score > state.nextBossScore && !state.bossActive) {
                state.bossActive = true; enemies.push(new Boss());
            }
            if(!state.bossActive && state.frames % (60 - state.difficulty) === 0) {
                const type = Math.random() > 0.8 ? 'chaser' : 'grunt';
                enemies.push(new Enemy(type));
            }
            state.frames++;

            // Collision Logic (Simplified)
            bullets = bullets.filter(b => !b.dead); enemies = enemies.filter(e => !e.dead);
            particles = particles.filter(p => !p.dead); powerups = powerups.filter(p => !p.dead); shards = shards.filter(s => !s.dead);

            bullets.forEach(b => {
                b.update();
                if(b.isEnemy) {
                    if(Math.hypot(b.pos.x-player.pos.x, b.pos.y-player.pos.y) < player.radius && !player.invulnerable) {
                        b.dead = true; player.hp--; player.invulnerable = 120; updateHud(); AudioEngine.playSound('player_hit');
                        if(player.hp<=0) location.reload(); // Simple Game Over
                    }
                } else {
                    enemies.forEach(e => {
                        if(Math.hypot(b.pos.x-e.pos.x, b.pos.y-e.pos.y) < e.radius + 10) {
                             if(!b.hitIds.includes(e.id)) {
                                 b.hitIds.push(e.id); b.piercing--; if(b.piercing<0) b.dead=true;
                                 e instanceof Boss ? e.takeDamage(b.damage) : e.hit(b.damage);
                             }
                        }
                    });
                }
            });
            
            if(!player.invulnerable) {
                enemies.forEach(e => {
                    if(Math.hypot(player.pos.x-e.pos.x, player.pos.y-e.pos.y) < player.radius + e.radius) {
                        player.hp--; player.invulnerable=60; updateHud(); AudioEngine.playSound('player_hit');
                        if(player.hp<=0) location.reload();
                    }
                });
            }
            if(state.xp >= state.xpNeeded) showLevelUpScreen();
        }

        init();

    </script>
</body>
