<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Cube (Robust Match)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Poppins', sans-serif;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .header {
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            padding: 15px;
            pointer-events: auto;
        }

        h1 {
            margin: 0;
            color: #4ecdc4;
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.5);
            font-size: 1.4rem;
        }

        p { margin: 5px 0 10px; color: #aaa; font-size: 0.85rem; }

        .size-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
        }

        .size-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .size-btn.active {
            background: #4ecdc4;
            color: #121212;
            border-color: #4ecdc4;
            font-weight: 600;
        }

        .controls-bottom {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            pointer-events: auto;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 25px;
            font-family: inherit;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .action-btn:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
        .action-btn:active { transform: scale(0.95); }
        
        #solve-btn { border-color: #4ecdc4; color: #4ecdc4; }
        #solve-btn:hover { background: rgba(78, 205, 196, 0.2); }

        /* Directional Controls */
        #floating-arrows {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            display: none;
            z-index: 20;
        }

        #floating-arrows.active {
            display: block;
        }

        .arrow-btn {
            position: absolute;
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(78, 205, 196, 0.8);
            color: #121212;
            border: 2px solid white;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.1s, background 0.1s;
            pointer-events: auto;
        }
        
        .arrow-btn:hover { background: white; transform: translate(-50%, -50%) scale(1.2); }
        
        .btn-up    { top: -60px; left: 0; }
        .btn-down  { top: 60px; left: 0; }
        .btn-left  { top: 0; left: -60px; }
        .btn-right { top: 0; left: 60px; }

        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; z-index: 99;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s;
            flex-direction: column;
        }
        #loading h1 { font-size: 1.5rem; margin-bottom: 10px; }
        #loading p { color: #666; }

        /* Victory Modal */
        #victory-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #4ecdc4;
            display: none;
            z-index: 100;
            backdrop-filter: blur(10px);
            min-width: 300px;
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.3);
        }
        #victory-modal h2 {
            color: #ffd700;
            margin-top: 0;
            font-size: 2rem;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        #victory-modal p {
            color: #fff;
            font-size: 1.1rem;
            margin: 20px 0 30px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="loading">
        <h1>Generating Puzzle...</h1>
        <p>Finding valid intersections</p>
    </div>

    <div id="victory-modal">
        <h2 id="victory-title">Solved!</h2>
        <p id="victory-text"></p>
        <button class="action-btn" onclick="game.scramble()">Play Again</button>
    </div>

    <div id="ui-layer">
        <div class="header">
            <h1>Word Cube</h1>
            <p>Match words both horizontally AND vertically.</p>
            <div class="size-controls">
                <button class="size-btn" onclick="game.setGridSize(2)">2x2</button>
                <button class="size-btn" onclick="game.setGridSize(3)">3x3</button>
                <button class="size-btn active" onclick="game.setGridSize(4)">4x4</button>
                <button class="size-btn" onclick="game.setGridSize(5)">5x5</button>
            </div>
        </div>
        
        <div class="controls-bottom">
            <button class="action-btn" onclick="game.scramble()">Shuffle</button>
            <button id="solve-btn" class="action-btn" onclick="game.solve()">Auto Solve</button>
        </div>
    </div>

    <div id="floating-arrows">
        <div class="arrow-btn btn-up" id="btn-up"><i class="fas fa-arrow-up"></i></div>
        <div class="arrow-btn btn-left" id="btn-left"><i class="fas fa-arrow-left"></i></div>
        <div class="arrow-btn btn-right" id="btn-right"><i class="fas fa-arrow-right"></i></div>
        <div class="arrow-btn btn-down" id="btn-down"><i class="fas fa-arrow-down"></i></div>
    </div>

    const COLORS = { bg: 0x1a1a1a, cube: 0x252525, text: '#ffffff', highlight: 0x4ecdc4 };

    class WordCube {
        constructor() {
            this.gridSize = 4; 
            this.wordFaces = {};
            this.cubies = [];
            this.moveStack = [];
            this.isAnimating = false;
            this.isPlaying = false;
            this.selectedCubie = null;
            this.selectedNormal = null;
            this.prefixes = new Set(); 
            this.audioCtx = null;
            this.solvedFaceIds = new Set(); 
            this.globalUsedWords = new Set();
            this.usedAutoSolve = false;
            this.gameWon = false;

            this.wordSets = {};
            for (const s in DICTIONARY) {
                this.wordSets[s] = new Set(DICTIONARY[s]);
            }
            
            this.initAudio();
            this.initThree();
            this.setGridSize(4);
            this.initInputs();
            this.animate();
        }

        initAudio() {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        playMoveSound() {
            if (!this.audioCtx) return;
            if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, this.audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, this.audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
            osc.start();
            osc.stop(this.audioCtx.currentTime + 0.15);
        }

        playFaceSuccessSound() {
            if (!this.audioCtx) return;
            if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            const t = this.audioCtx.currentTime;
            // Bright C Major 7 sweep for face completion
            [523.25, 659.25, 783.99, 987.77, 1046.50].forEach((freq, i) => {
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, t + i * 0.08);
                gain.gain.setValueAtTime(0, t + i * 0.08);
                gain.gain.linearRampToValueAtTime(0.1, t + i * 0.08 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.8);
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start(t + i * 0.08);
                osc.stop(t + i * 0.08 + 1.0);
            });
        }

        playMatchSound() {
            if (!this.audioCtx) return;
            if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            const t = this.audioCtx.currentTime;
            // Simple Major Chord Arpeggio for success
            [440, 554.37, 659.25].forEach((freq, i) => {
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, t + i * 0.05);
                gain.gain.setValueAtTime(0, t + i * 0.05);
                gain.gain.linearRampToValueAtTime(0.05, t + i * 0.05 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.05 + 0.4);
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start(t + i * 0.05);
                osc.stop(t + i * 0.05 + 0.5);
            });
        }

        initThree() {
            this.scene = new THREE.Scene();
            this.scene.background = new THREE.Color(COLORS.bg);

            this.camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(this.renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            this.scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            this.scene.add(dirLight);
            
            // Highlight Mesh
            this.highlightMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(0.9, 0.9),
                new THREE.MeshBasicMaterial({ color: COLORS.highlight, transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthTest: false })
            );
            this.highlightMesh.visible = false;
            this.highlightMesh.renderOrder = 1;
            this.scene.add(this.highlightMesh);

            window.addEventListener('resize', () => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        buildPrefixes(size) {
            this.prefixes.clear();
            const pool = DICTIONARY[size];
            for (const word of pool) {
                for (let i = 1; i <= word.length; i++) {
                    this.prefixes.add(word.substring(0, i));
                }
            }
        }

        generateWordSquare(size) {
            const pool = DICTIONARY[size];
            
            // Prioritize unused words
            const unused = pool.filter(w => !this.globalUsedWords.has(w));
            const used = pool.filter(w => this.globalUsedWords.has(w));
            
            // Randomize both lists
            unused.sort(() => 0.5 - Math.random());
            used.sort(() => 0.5 - Math.random());
            
            // Combine: Try unused words first, then fall back to already used ones
            const shuffled = [...unused, ...used];
            
            const startTime = Date.now();

            const solve = (rows) => {
                if (Date.now() - startTime > 2000) return null; // Increased Timeout for robustness
                if (rows.length === size) return rows;

                for (const word of shuffled) {
                    let fits = true;
                    for (let c = 0; c < size; c++) {
                        let colStr = "";
                        for (let r = 0; r < rows.length; r++) colStr += rows[r][c];
                        colStr += word[c];
                        if (!this.prefixes.has(colStr)) {
                            fits = false;
                            break;
                        }
                    }
                    if (fits) {
                        const result = solve([...rows, word.split('')]);
                        if (result) return result;
                    }
                }
                return null;
            };

            let square = solve([]);
            
            if (!square) {
                // FALLBACK: SAFETY SQUARE
                // If we can't find a complex intersection, create a "Safety Square"
                // This is just one word repeated 'size' times. 
                // It's geometrically valid (symmetric) so the game won't break.
                const safetyWord = shuffled[0] || "WORD"; 
                square = [];
                for(let i=0; i<size; i++) square.push(safetyWord.split(''));
            } 
            
            // Mark words as used
            square.forEach(row => {
                this.globalUsedWords.add(row.join(''));
            });
            for(let c=0; c<size; c++) {
                let colWord = "";
                for(let r=0; r<size; r++) colWord += square[r][c];
                if (this.wordSets[size].has(colWord)) this.globalUsedWords.add(colWord);
            }

            return square;
        }

        generateWords() {
            this.globalUsedWords.clear(); // Reset used words for new game
            this.buildPrefixes(this.gridSize);
            const sides = ['front', 'back', 'up', 'down', 'left', 'right'];
            this.wordFaces = {};
            sides.forEach(side => {
                this.wordFaces[side] = this.generateWordSquare(this.gridSize);
            });
        }

        setGridSize(n) {
            this.gridSize = n;
            this.deselect();
            this.moveStack = [];
            this.usedAutoSolve = false;
            this.gameWon = false;
            this.isPlaying = false; // Prevent victory on load
            
            // CLEANUP: Stop all animations to prevent lingering effects
            TWEEN.removeAll();
            this.solvedFaceIds.clear();
            
            document.getElementById('victory-modal').style.display = 'none';
            
            document.querySelectorAll('.size-btn').forEach(b => {
                b.classList.toggle('active', parseInt(b.innerText) === n);
            });
            
            const l = document.getElementById('loading');
            l.style.display = 'flex';
            l.style.opacity = 1;

            setTimeout(() => {
                this.generateWords();
                this.rebuildCube();
                
                const dist = n === 2 ? 8 : (n === 3 ? 9 : (n === 4 ? 10 : 12));
                this.camera.position.set(dist * 0.8, dist * 0.6, dist);
                this.camera.lookAt(0,0,0);

                // Check matches immediately so it starts solved (visually)
                this.checkMatches();

                setTimeout(() => this.scramble(), 1000);
            }, 100);
        }

        rebuildCube() {
            // DISPOSE old geometries/materials to prevent memory leaks
            this.cubies.forEach(c => {
                this.scene.remove(c);
                if (c.geometry) c.geometry.dispose();
                if (c.material) c.material.dispose();
                c.children.forEach(child => {
                     if(child.geometry) child.geometry.dispose();
                     if(child.material) {
                         if(child.material.map) child.material.map.dispose();
                         child.material.dispose();
                     }
                });
            });
            this.cubies = [];

            const size = this.gridSize;
            const offset = (size - 1) / 2;
            const geo = new THREE.BoxGeometry(0.95, 0.95, 0.95);
            const mat = new THREE.MeshStandardMaterial({ color: COLORS.cube, roughness: 0.6 });

            for(let x = 0; x < size; x++) {
                for(let y = 0; y < size; y++) {
                    for(let z = 0; z < size; z++) {
                        const wx = x - offset;
                        const wy = y - offset;
                        const wz = z - offset;

                        const cubie = new THREE.Mesh(geo, mat);
                        cubie.position.set(wx, wy, wz);
                        this.scene.add(cubie);
                        this.cubies.push(cubie);

                        if (z === size - 1) this.addText(cubie, this.wordFaces.front[size-1-y][x], 'z', 1);
                        if (z === 0) this.addText(cubie, this.wordFaces.back[size-1-y][size-1-x], 'z', -1);
                        if (x === size - 1) this.addText(cubie, this.wordFaces.right[size-1-y][size-1-z], 'x', 1);
                        if (x === 0) this.addText(cubie, this.wordFaces.left[size-1-y][z], 'x', -1);
                        if (y === size - 1) this.addText(cubie, this.wordFaces.up[z][x], 'y', 1);
                        if (y === 0) this.addText(cubie, this.wordFaces.down[size-1-z][x], 'y', -1);
                    }
                }
            }

            const l = document.getElementById('loading');
            l.style.opacity = 0;
            setTimeout(() => l.style.display = 'none', 500);
        }

        addText(parent, char, axis, dir) {
            if (!char) return;
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshStandardMaterial({ 
                map: texture, 
                color: 0xffffff, 
                emissive: 0x000000,
                roughness: 0.4
            });
            const plane = new THREE.Mesh(new THREE.PlaneGeometry(0.85, 0.85), material);
            
            plane.userData = { 
                char: char, 
                axis: axis, 
                dir: dir, 
                status: 0, // 0: none, 1: word, 2: face
                canvas: canvas,
                ctx: ctx,
                texture: texture
            };

            // Initial Draw
            this.updateStickerColor(plane, 0);

            const offset = 0.48;
            if (axis === 'z') {
                plane.position.z = offset * dir;
                if (dir === -1) plane.rotation.y = Math.PI;
            } else if (axis === 'x') {
                plane.position.x = offset * dir;
                plane.rotation.y = (Math.PI / 2) * dir;
            } else if (axis === 'y') {
                plane.position.y = offset * dir;
                plane.rotation.x = -(Math.PI / 2) * dir;
            }
            parent.add(plane);
        }

        updateStickerColor(mesh, status) {
            const ctx = mesh.userData.ctx;
            const char = mesh.userData.char;
            
            // FIX: Explicitly reset shadow state before drawing the background box.
            // This prevents the previous frame's "Face Match" glow from bleeding onto
            // the background of a "Word Match" or "No Match" sticker.
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            ctx.fillStyle = '#222';
            ctx.fillRect(0,0,128,128);
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 10;
            ctx.strokeRect(0,0,128,128);
            
            // Color Logic
            let color = '#ffffff';
            if (status === 1) color = '#4ecdc4'; // Word Match (Teal)
            if (status === 2) color = '#ffd700'; // Face Match (Gold)

            ctx.fillStyle = color;
            
            // Glow effect for Face Match
            if (status === 2) {
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 30;
            }

            ctx.font = 'bold 80px Poppins';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(char, 64, 70);
            
            mesh.userData.texture.needsUpdate = true;
        }

        checkMatches() {
            // NEW ROBUST GRID-BASED LOGIC
            const size = this.gridSize;
            const offset = (size - 1) / 2;
            const wordSolvedSet = new Set();
            const faceSolvedSet = new Set();
            const currentSolvedFaceIds = new Set();

            // 1. Map all stickers to a discrete 3D grid
            // grid[x][y][z] will hold references to the active stickers at that slot
            const grid = Array(size).fill().map(() => Array(size).fill().map(() => Array(size).fill(null)));
            const stickers = [];

            this.cubies.forEach(c => {
                c.children.forEach(child => {
                    if (child.isMesh && child.userData.char) {
                        const worldPos = new THREE.Vector3();
                        child.getWorldPosition(worldPos);
                        
                        const normal = new THREE.Vector3(0, 0, 1);
                        normal.applyQuaternion(child.getWorldQuaternion(new THREE.Quaternion()));

                        const ix = Math.round(worldPos.x + offset);
                        const iy = Math.round(worldPos.y + offset);
                        const iz = Math.round(worldPos.z + offset);

                        stickers.push({ mesh: child, ix, iy, iz, normal });

                        if (ix >= 0 && ix < size && iy >= 0 && iy < size && iz >= 0 && iz < size) {
                            if (!grid[ix][iy][iz]) grid[ix][iy][iz] = {};
                            
                            // Categorize sticker by normal direction
                            if (normal.z > 0.9) grid[ix][iy][iz].front = child;
                            else if (normal.z < -0.9) grid[ix][iy][iz].back = child;
                            else if (normal.x > 0.9) grid[ix][iy][iz].right = child;
                            else if (normal.x < -0.9) grid[ix][iy][iz].left = child;
                            else if (normal.y > 0.9) grid[ix][iy][iz].up = child;
                            else if (normal.y < -0.9) grid[ix][iy][iz].down = child;
                        }
                    }
                });
            });

            // 2. Check Words on Faces deterministically using grid indices
            
            const isValidSequence = (meshes) => {
                if (meshes.length !== size) return false;

                // Orientation Consistency Check
                const q = new THREE.Quaternion();
                const firstUp = new THREE.Vector3(0, 1, 0);
                meshes[0].getWorldQuaternion(q);
                firstUp.applyQuaternion(q);

                const isConsistent = meshes.every(m => {
                    const up = new THREE.Vector3(0, 1, 0);
                    m.getWorldQuaternion(q);
                    up.applyQuaternion(q);
                    return up.dot(firstUp) > 0.9; // Allow small floating point drift
                });

                if (!isConsistent) return false;
                
                // Word check
                const word = meshes.map(m => m.userData.char).join('');
                const revWord = meshes.map(m => m.userData.char).reverse().join('');
                return this.wordSets[size].has(word) || this.wordSets[size].has(revWord);
            };

            const checkFace = (id, rows, cols) => {
                let faceComplete = true;
                const faceMeshes = [];
                const validWordMeshes = [];

                // Check Rows
                rows.forEach(row => {
                    faceMeshes.push(...row);
                    if (isValidSequence(row)) {
                        validWordMeshes.push(...row);
                    } else {
                        faceComplete = false;
                    }
                });

                // Check Cols
                cols.forEach(col => {
                    // Avoid duplicates in faceMeshes list if desired, but Set handles it later
                    faceMeshes.push(...col); 
                    if (isValidSequence(col)) {
                        validWordMeshes.push(...col);
                    } else {
                        faceComplete = false;
                    }
                });

                if (faceComplete) {
                    faceMeshes.forEach(m => faceSolvedSet.add(m));
                    currentSolvedFaceIds.add(id);
                } else {
                    validWordMeshes.forEach(m => wordSolvedSet.add(m));
                }
            };

            // --- FRONT FACE (z = size-1) ---
            {
                const rows = [];
                for (let y = size - 1; y >= 0; y--) {
                    const row = [];
                    for (let x = 0; x < size; x++) if(grid[x][y][size-1]?.front) row.push(grid[x][y][size-1].front);
                    rows.push(row);
                }
                const cols = [];
                for (let x = 0; x < size; x++) {
                    const col = [];
                    for (let y = size - 1; y >= 0; y--) if(grid[x][y][size-1]?.front) col.push(grid[x][y][size-1].front);
                    cols.push(col);
                }
                checkFace('front', rows, cols);
            }

            // --- BACK FACE (z = 0) ---
            {
                const rows = [];
                for (let y = size - 1; y >= 0; y--) {
                    const row = [];
                    for (let x = size - 1; x >= 0; x--) if(grid[x][y][0]?.back) row.push(grid[x][y][0].back);
                    rows.push(row);
                }
                const cols = [];
                for (let x = size - 1; x >= 0; x--) {
                    const col = [];
                    for (let y = size - 1; y >= 0; y--) if(grid[x][y][0]?.back) col.push(grid[x][y][0].back);
                    cols.push(col);
                }
                checkFace('back', rows, cols);
            }

            // --- RIGHT FACE (x = size-1) ---
            {
                const rows = [];
                for (let y = size - 1; y >= 0; y--) {
                    const row = [];
                    for (let z = size - 1; z >= 0; z--) if(grid[size-1][y][z]?.right) row.push(grid[size-1][y][z].right);
                    rows.push(row);
                }
                const cols = [];
                for (let z = size - 1; z >= 0; z--) {
                    const col = [];
                    for (let y = size - 1; y >= 0; y--) if(grid[size-1][y][z]?.right) col.push(grid[size-1][y][z].right);
                    cols.push(col);
                }
                checkFace('right', rows, cols);
            }

            // --- LEFT FACE (x = 0) ---
            {
                const rows = [];
                for (let y = size - 1; y >= 0; y--) {
                    const row = [];
                    for (let z = 0; z < size; z++) if(grid[0][y][z]?.left) row.push(grid[0][y][z].left);
                    rows.push(row);
                }
                const cols = [];
                for (let z = 0; z < size; z++) {
                    const col = [];
                    for (let y = size - 1; y >= 0; y--) if(grid[0][y][z]?.left) col.push(grid[0][y][z].left);
                    cols.push(col);
                }
                checkFace('left', rows, cols);
            }

            // --- UP FACE (y = size-1) ---
            {
                const rows = [];
                for (let z = 0; z < size; z++) {
                    const row = [];
                    for (let x = 0; x < size; x++) if(grid[x][size-1][z]?.up) row.push(grid[x][size-1][z].up);
                    rows.push(row);
                }
                const cols = [];
                for (let x = 0; x < size; x++) {
                    const col = [];
                    for (let z = 0; z < size; z++) if(grid[x][size-1][z]?.up) col.push(grid[x][size-1][z].up);
                    cols.push(col);
                }
                checkFace('up', rows, cols);
            }

            // --- DOWN FACE (y = 0) ---
            {
                const rows = [];
                for (let z = size - 1; z >= 0; z--) {
                    const row = [];
                    for (let x = 0; x < size; x++) if(grid[x][0][z]?.down) row.push(grid[x][0][z].down);
                    rows.push(row);
                }
                const cols = [];
                for (let x = 0; x < size; x++) {
                    const col = [];
                    for (let z = size - 1; z >= 0; z--) if(grid[x][0][z]?.down) col.push(grid[x][0][z].down);
                    cols.push(col);
                }
                checkFace('down', rows, cols);
            }

            // Apply Visuals & Sound
            let foundNewWordMatch = false;
            let foundNewFaceMatch = false;

            stickers.forEach(s => {
                const mesh = s.mesh;
                let status = 0;
                if (faceSolvedSet.has(mesh)) status = 2;
                else if (wordSolvedSet.has(mesh)) status = 1;
                
                if (mesh.userData.status !== status) {
                    if (status === 1 && mesh.userData.status === 0) foundNewWordMatch = true;
                    mesh.userData.status = status;
                    this.updateStickerColor(mesh, status);
                }
            });

            // Check for new Face completions
            currentSolvedFaceIds.forEach(id => {
                if (!this.solvedFaceIds.has(id)) {
                    foundNewFaceMatch = true;
                    this.solvedFaceIds.add(id);
                }
            });
            // Cleanup solvedFaces that are broken
            this.solvedFaceIds.forEach(id => {
                if (!currentSolvedFaceIds.has(id)) this.solvedFaceIds.delete(id);
            });

            if (foundNewFaceMatch) this.playFaceSuccessSound();
            else if (foundNewWordMatch) this.playMatchSound();

            // Victory Condition Check - ONLY if game is playing
            if (this.solvedFaceIds.size === 6 && !this.gameWon && this.isPlaying) {
                 this.gameWon = true;
                 setTimeout(() => this.showVictory(), 500);
            }
        }

        showVictory() {
             const modal = document.getElementById('victory-modal');
             const title = document.getElementById('victory-title');
             const text = document.getElementById('victory-text');
             
             let message = "";
             let header = "CUBE CONQUERED!";

             if (this.usedAutoSolve) {
                 header = "ROBOT VICTORY";
                 message = "The computer solved it. You watched. Good job watching.";
             } else if (this.gridSize === 2) {
                 header = "TOO EASY?";
                 message = "Wow, a 2x2. Don't overexert that massive brain of yours.";
             } else if (this.gridSize === 3) {
                 message = "Nice work! Now try the 4x4 for a real challenge.";
             } else if (this.gridSize === 4) {
                 message = "Impressive! That's a lot of words.";
             } else {
                 header = "GENIUS LEVEL";
                 message = "Incredible! You have mastered the Word Cube.";
             }

             title.innerText = header;
             text.innerText = message;
             modal.style.display = 'block';
             
             this.playFaceSuccessSound();
        }

        initInputs() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let isDragging = false;
            let startX = 0, startY = 0;
            let dragTarget = null;

            const onDown = (e) => {
                // Resume Audio Context on interaction
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }

                if (this.isAnimating) return;
                isDragging = true;
                startX = e.clientX || e.touches[0].clientX;
                startY = e.clientY || e.touches[0].clientY;

                if (e.target.closest('.arrow-btn') || e.target.closest('.size-btn') || e.target.closest('.action-btn')) return;

                mouse.x = (startX / window.innerWidth) * 2 - 1;
                mouse.y = -(startY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, this.camera);
                const intersects = raycaster.intersectObjects(this.cubies);

                if (intersects.length > 0 && e.button !== 2) {
                    dragTarget = 'cubie';
                    this.selectCubie(intersects[0].object, intersects[0].face.normal);
                } else {
                    dragTarget = 'camera';
                    this.deselect();
                }
            };

            const onMove = (e) => {
                if (!isDragging) return;
                const cx = e.clientX || e.touches[0].clientX;
                const cy = e.clientY || e.touches[0].clientY;
                const dx = cx - startX;
                const dy = cy - startY;

                if (dragTarget === 'camera') {
                    const radius = this.camera.position.distanceTo(new THREE.Vector3(0,0,0));
                    const theta = Math.atan2(this.camera.position.x, this.camera.position.z);
                    const phi = Math.acos(this.camera.position.y / radius);
                    const newTheta = theta - Math.toRadians(dx * 0.5);
                    let newPhi = phi - Math.toRadians(dy * 0.5);
                    newPhi = Math.max(0.1, Math.min(Math.PI - 0.1, newPhi));
                    this.camera.position.x = radius * Math.sin(newPhi) * Math.sin(newTheta);
                    this.camera.position.y = radius * Math.cos(newPhi);
                    this.camera.position.z = radius * Math.sin(newPhi) * Math.cos(newTheta);
                    this.camera.lookAt(0,0,0);
                    startX = cx; startY = cy;
                    if(this.selectedCubie) this.updateArrowPosition();
                } 
                else if (dragTarget === 'cubie') {
                    if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
                        if (Math.abs(dx) > Math.abs(dy)) this.handleUiMove(dx > 0 ? 'right' : 'left');
                        else this.handleUiMove(dy > 0 ? 'down' : 'up');
                        isDragging = false;
                        dragTarget = null;
                    }
                }
            };

            const onUp = () => { isDragging = false; dragTarget = null; };

            window.addEventListener('mousedown', onDown);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
            window.addEventListener('touchstart', e => onDown(e), {passive: false});
            window.addEventListener('touchmove', e => { e.preventDefault(); onMove(e); }, {passive: false});
            window.addEventListener('touchend', onUp);
            
            document.getElementById('btn-up').onclick = (e) => { e.stopPropagation(); this.handleUiMove('up'); };
            document.getElementById('btn-down').onclick = (e) => { e.stopPropagation(); this.handleUiMove('down'); };
            document.getElementById('btn-left').onclick = (e) => { e.stopPropagation(); this.handleUiMove('left'); };
            document.getElementById('btn-right').onclick = (e) => { e.stopPropagation(); this.handleUiMove('right'); };
        }

        selectCubie(cubie, localNormal) {
            this.selectedCubie = cubie;
            const normalWorld = localNormal.clone().transformDirection(cubie.matrixWorld).round();
            this.selectedNormal = normalWorld;
            const highlightPos = cubie.position.clone().add(normalWorld.clone().multiplyScalar(0.51));
            this.highlightMesh.position.copy(highlightPos);
            this.highlightMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), normalWorld);
            this.highlightMesh.visible = true;
            this.updateArrowPosition();
            document.getElementById('floating-arrows').classList.add('active');
        }

        updateArrowPosition() {
            if(!this.selectedCubie) return;
            const vector = this.highlightMesh.position.clone();
            vector.project(this.camera);
            const x = (vector.x * .5 + .5) * window.innerWidth;
            const y = (-(vector.y * .5) + .5) * window.innerHeight;
            const div = document.getElementById('floating-arrows');
            div.style.left = `${x}px`;
            div.style.top = `${y}px`;
        }

        deselect() {
            this.selectedCubie = null;
            this.selectedNormal = null;
            this.highlightMesh.visible = false;
            document.getElementById('floating-arrows').classList.remove('active');
        }

        handleUiMove(directionName) {
            if (!this.selectedCubie || this.isAnimating) return;
            const N = this.selectedNormal;
            const worldPos = this.selectedCubie.position;

            let targetScreenDir = new THREE.Vector2();
            if (directionName === 'up') targetScreenDir.set(0, 1);
            if (directionName === 'down') targetScreenDir.set(0, -1);
            if (directionName === 'left') targetScreenDir.set(-1, 0);
            if (directionName === 'right') targetScreenDir.set(1, 0);

            const axes = [new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1)];
            const tangents = axes.filter(a => Math.abs(a.dot(N)) < 0.5);
            
            let bestMatch = null;
            let maxDot = -Infinity;

            const getScreenVector = (vec3) => {
                const p1 = worldPos.clone().project(this.camera);
                const p2 = worldPos.clone().add(vec3).project(this.camera);
                return new THREE.Vector2(p2.x - p1.x, p2.y - p1.y).normalize(); 
            };

            tangents.forEach(tangent => {
                const screenTan = getScreenVector(tangent);
                const dot = screenTan.dot(targetScreenDir);
                if (Math.abs(dot) > maxDot) {
                    maxDot = Math.abs(dot);
                    bestMatch = { axisVec: tangent, sign: Math.sign(dot) };
                }
            });

            if (!bestMatch) return;
            const motionDir = bestMatch.axisVec.clone().multiplyScalar(bestMatch.sign);
            const rotAxisVec = new THREE.Vector3().crossVectors(N, motionDir);
            
            let axisName = '';
            let rotDir = 0;
            if (Math.abs(rotAxisVec.x) > 0.9) { axisName = 'x'; rotDir = rotAxisVec.x; }
            else if (Math.abs(rotAxisVec.y) > 0.9) { axisName = 'y'; rotDir = rotAxisVec.y; }
            else if (Math.abs(rotAxisVec.z) > 0.9) { axisName = 'z'; rotDir = rotAxisVec.z; }
            
            const layerVal = this.selectedCubie.position[axisName];
            this.rotateLayer(axisName, layerVal, rotDir);
        }

        snapRotation(cubie) {
            // Robust Grid Snapping using Quaternions directly to avoid Euler gimbal locks
            const q = cubie.quaternion;
            const m = new THREE.Matrix4().makeRotationFromQuaternion(q);
            
            // Extract basis vectors
            const x = new THREE.Vector3();
            const y = new THREE.Vector3();
            const z = new THREE.Vector3();
            m.extractBasis(x, y, z);

            // Snap each basis vector to nearest axis (0, 1, or -1)
            const snap = (v) => {
                const max = Math.max(Math.abs(v.x), Math.abs(v.y), Math.abs(v.z));
                v.x = Math.abs(v.x) === max ? Math.sign(v.x) : 0;
                v.y = Math.abs(v.y) === max ? Math.sign(v.y) : 0;
                v.z = Math.abs(v.z) === max ? Math.sign(v.z) : 0;
                return v;
            };
            
            snap(x); snap(y); snap(z);
            
            // Reconstruct matrix and quaternion
            m.makeBasis(x, y, z);
            cubie.quaternion.setFromRotationMatrix(m);
            cubie.updateMatrixWorld(); // Ensure internals are fresh immediately
        }

        rotateLayer(axis, layerCoord, direction, duration = 400, isSolving = false) {
            if (this.isAnimating) return Promise.resolve();
            this.isAnimating = true;
            this.deselect();

            // Trigger Sound
            this.playMoveSound();

            const epsilon = 0.1;
            const activeCubies = this.cubies.filter(c => Math.abs(c.position[axis] - layerCoord) < epsilon);
            const pivot = new THREE.Object3D();
            this.scene.add(pivot);

            activeCubies.forEach(c => { this.scene.remove(c); pivot.add(c); });

            const targetRotation = (Math.PI / 2) * direction;
            if (!isSolving) this.moveStack.push({ axis, layerCoord, direction: -direction });

            return new Promise(resolve => {
                new TWEEN.Tween({ rot: 0 })
                    .to({ rot: targetRotation }, duration)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .onUpdate((obj) => { pivot.rotation[axis] = obj.rot; })
                    .onComplete(() => {
                        pivot.updateMatrixWorld();
                        activeCubies.forEach(c => {
                            c.position.setFromMatrixPosition(c.matrixWorld);
                            c.quaternion.setFromRotationMatrix(c.matrixWorld);
                            
                            // Snap both position AND rotation
                            c.position.x = Math.round(c.position.x * 2) / 2;
                            c.position.y = Math.round(c.position.y * 2) / 2;
                            c.position.z = Math.round(c.position.z * 2) / 2;
                            this.snapRotation(c);

                            pivot.remove(c);
                            this.scene.add(c);
                            c.updateMatrixWorld(); // FORCE UPDATE for checkMatches
                        });
                        this.scene.remove(pivot);
                        
                        this.checkMatches();

                        this.isAnimating = false;
                        resolve();
                    })
                    .start();
            });
        }

        async scramble() {
            if (this.isAnimating) return;
            this.moveStack = [];
            this.gameWon = false;
            this.usedAutoSolve = false;
            document.getElementById('victory-modal').style.display = 'none';
            
            this.cubies.forEach(c => c.children.forEach(m => {
                if(m.userData.char) {
                    m.userData.status = 0;
                    m.material.color.setHex(0xffffff);
                    m.material.emissive.setHex(0x000000);
                    this.updateStickerColor(m, 0); 
                }
            }));

            const axes = ['x', 'y', 'z'];
            const size = this.gridSize;
            const offset = (size - 1) / 2;
            const layers = [];
            for(let i=0; i<size; i++) layers.push(i - offset);

            for(let i=0; i<size * 3; i++) {
                const rAxis = axes[Math.floor(Math.random()*3)];
                const rLayer = layers[Math.floor(Math.random()*size)];
                const rDir = Math.random() > 0.5 ? 1 : -1;
                await this.rotateLayer(rAxis, rLayer, rDir, 100, false);
            }
            this.isPlaying = true; // Only enable game won logic after scramble
        }

        async solve() {
            if (this.isAnimating || this.moveStack.length === 0) return;
            const btn = document.getElementById('solve-btn');
            this.usedAutoSolve = true;
            btn.innerText = "Solving...";
            btn.disabled = true;
            while(this.moveStack.length > 0) {
                const move = this.moveStack.pop();
                await this.rotateLayer(move.axis, move.layerCoord, move.direction, 150, true);
            }
            btn.innerText = "Auto Solve";
            btn.disabled = false;
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            TWEEN.update();
            if (this.highlightMesh.visible) {
                this.highlightMesh.material.opacity = 0.4 + Math.sin(Date.now() * 0.005) * 0.1;
                this.updateArrowPosition();
            }
            this.renderer.render(this.scene, this.camera);
        }
    }

    Math.toRadians = (deg) => deg * (Math.PI / 180);
    const game = new WordCube();
</script>
